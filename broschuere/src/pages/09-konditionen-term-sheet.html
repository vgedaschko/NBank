  <figure class="module p09-ts" role="group" aria-labelledby="p09-ts-h">
    <table class="table table--terms">
      <caption class="u-sr" id="p09-ts-h">Eckdaten</caption>
      <thead><tr><th scope="col">Position</th><th scope="col">Kondition</th></tr></thead>
      <tbody>
        <tr><th scope="row" class="u-nohyphens">Antrag, Bewilligung</th><td>Antrag bei der Wohnraumförderstelle am Bauort; die NBank bewilligt und schließt mit Ihnen einen öffentlich-rechtlichen Fördervertrag</td></tr>
        <tr><th scope="row" class="u-nohyphens">Sätze (Höchstwerte)</th><td>Darlehen <b>40/60/70 %</b> plus Zuschuss <b>40/20/10 %</b> (Gruppe A/B/C), zusammen <b>80 %</b> der zuwendungsfähigen Kosten; Zuschuss nur mit Darlehen, B und C nur mit Zulassung. Zuschlag auf den Zuschuss: Modellprojekt +5, Housing First +10 Prozentpunkte <a class="pageref" href="#seite-08">→&nbsp;S.&nbsp;8</a></td></tr>
        <tr><th scope="row" class="u-nohyphens">Eigenmittel</th><td><b>mindestens 20 %</b> der zuwendungsfähigen Kosten, mit Zuschlag entsprechend weniger; davon soll mindestens die Hälfte Geld oder lastenfreies Grundstück sein</td></tr>
        <tr><th scope="row" class="u-nohyphens">Zins</th><td><b>0 %</b> bis Ende des 35. Jahres nach Bezugsfertigkeit; danach bis zu 3 Prozentpunkte über dem Basiszinssatz, höchstens marktüblich</td></tr>
        <tr><th scope="row" class="u-nohyphens">Tilgung</th><td>Satz legt die NBank fest; Beginn nach vollständiger Auszahlung, spätestens zwei Jahre nach dem Monat, der auf die Bekanntgabe der Förderentscheidung folgt <a class="pageref" href="#seite-21">→&nbsp;S.&nbsp;21</a></td></tr>
        <tr><th scope="row" class="u-nohyphens">Kosten, laufend</th><td>Verwaltungskostenbeitrag <b>0,5 % p. a.</b> auf das Restkapital, ab Auszahlungsbeginn</td></tr>
        <tr><th scope="row" class="u-nohyphens">Kosten, einmalig</th><td>Bearbeitungsentgelt <b>1 %</b> des bewilligten Darlehens und <b>0,75 %</b> des bewilligten Zuschusses, jeweils mit der ersten Auszahlung verrechnet</td></tr>
        <tr><th scope="row" class="u-nohyphens">Auszahlung</th><td>in Raten nach Baufortschritt (Neubau: Zeitstrahl oben); Darlehen und Zuschuss je Rate anteilig, Ihre Eigenmittel in der Regel zuerst</td></tr>
        <tr><th scope="row" class="u-nohyphens">Sicherheiten</th><td>nachrangige Grundschuld direkt nach dem Bankdarlehen; Details <a class="pageref" href="#seite-21">→&nbsp;S.&nbsp;21</a></td></tr>
        <tr><th scope="row" class="u-nohyphens">Versicherung</th><td>Brand ab Baubeginn, Sturm ab Bezugsfertigkeit, jeweils gleitender Neuwert, bis zur vollständigen Rückzahlung</td></tr>
        <tr><th scope="row" class="u-nohyphens">Vorzeitige Rückzahlung</th><td>Bei freiwilliger Rückzahlung des Darlehens in voller Höhe ist der Zuschuss anteilig für die restliche Bindungsdauer zurückzuzahlen; die Bindungen enden frühestens <b>20 Jahre</b> nach Bindungsbeginn <a class="pageref" href="#seite-21">→&nbsp;S.&nbsp;21</a></td></tr>
        <tr class="is-key"><th scope="row" class="u-nohyphens">Beihilferecht</th><td>Die NBank begrenzt jede Förderung so, dass die Eigenkapitalrendite angemessen bleibt (Prüfung auf Überkompensation). Bis 1 Prozentpunkt über dem 30-jährigen Swapsatz gilt sie stets als angemessen</td></tr>
      </tbody>
    </table>
  </figure>
